name: MSK GitHub Release Deployment

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: msk-release-deployment
  cancel-in-progress: false

jobs:
  publish:
    name: Publish MSK Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate production tag
        id: release
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          VERSION=$(python -c "
          import tomllib
          from pathlib import Path
          data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          print(data['project']['version'])
          ")

          if [[ "$TAG" != "v${VERSION}" ]]; then
            echo "Tag does not match pyproject.toml version."
            exit 1
          fi

          TAG_COMMIT=$(git rev-parse HEAD)

          git fetch origin main --no-tags

          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "Tag is not reachable from main."
            exit 1
          fi

          PARENTS=$(git rev-list --parents -n 1 "$TAG_COMMIT")
          read -r -a PARENT_ARRAY <<< "$PARENTS"

          if [[ "${#PARENT_ARRAY[@]}" -ne 3 ]]; then
            echo "Expected a merge commit with exactly two parents."
            echo "Use Create a merge commit for release PRs."
            exit 1
          fi

          RELEASE_HEAD_SHA="${PARENT_ARRAY[2]}"
          SOURCE_TREE_SHA=$(git rev-parse "${TAG_COMMIT}^{tree}")

          echo "version=${TAG}" >> "$GITHUB_OUTPUT"
          echo "release_head_sha=${RELEASE_HEAD_SHA}" >> "$GITHUB_OUTPUT"
          echo "source_tree_sha=${SOURCE_TREE_SHA}" >> "$GITHUB_OUTPUT"

          echo "Version: ${TAG}"
          echo "Release source: ${RELEASE_HEAD_SHA}"

      - name: Find successful release validation run
        id: validation
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_HEAD_SHA: ${{ steps.release.outputs.release_head_sha }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          RELEASE_BRANCH="release/${VERSION#v}"

          RUNS_JSON=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release-validation.yml/runs?branch=${RELEASE_BRANCH}&event=pull_request&status=completed&per_page=100")

          RUN_ID=""
          PR_NUMBER=""

          while IFS= read -r CANDIDATE_RUN; do
            [[ -z "$CANDIDATE_RUN" ]] && continue

            RUN_DATA=$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${CANDIDATE_RUN}")

            PR_DATA=$(echo "$RUN_DATA" | jq -c '.pull_requests[0] // empty')
            [[ -z "$PR_DATA" ]] && continue

            CANDIDATE_PR=$(echo "$PR_DATA" | jq -r '.number')
            CANDIDATE_HEAD=$(echo "$PR_DATA" | jq -r '.head.sha')
            CANDIDATE_BASE=$(echo "$PR_DATA" | jq -r '.base.ref')

            if [[ "$CANDIDATE_HEAD" == "$RELEASE_HEAD_SHA" ]] &&
               [[ "$CANDIDATE_BASE" == "main" ]]; then
              RUN_ID="$CANDIDATE_RUN"
              PR_NUMBER="$CANDIDATE_PR"
              break
            fi
          done < <(
            echo "$RUNS_JSON" | jq -r '
              [
                .workflow_runs[]
                | select(
                    .status == "completed" and
                    .conclusion == "success"
                  )
              ]
              | sort_by(.created_at)
              | reverse
              | .[].id
            '
          )

          if [[ -z "$RUN_ID" || -z "$PR_NUMBER" ]]; then
            echo "No successful validation run found for the release commit."
            exit 1
          fi

          PR_DATA=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")

          PR_BASE=$(echo "$PR_DATA" | jq -r '.base.ref')
          PR_HEAD=$(echo "$PR_DATA" | jq -r '.head.sha')
          PR_BRANCH=$(echo "$PR_DATA" | jq -r '.head.ref')
          PR_STATE=$(echo "$PR_DATA" | jq -r '.state')
          PR_MERGED=$(echo "$PR_DATA" | jq -r '.merged')

          if [[ "$PR_BASE" != "main" ]] ||
             [[ "$PR_HEAD" != "$RELEASE_HEAD_SHA" ]] ||
             [[ "$PR_BRANCH" != "$RELEASE_BRANCH" ]] ||
             [[ "$PR_STATE" != "closed" ]] ||
             [[ "$PR_MERGED" != "true" ]]; then
            echo "Release PR verification failed."
            exit 1
          fi

          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "release_branch=${RELEASE_BRANCH}" >> "$GITHUB_OUTPUT"

          echo "Validation run: ${RUN_ID}"
          echo "Merged PR: #${PR_NUMBER}"

      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.validation.outputs.run_id }}
          pattern: msk-*
          path: release-assets
          merge-multiple: true

      - name: Verify release manifest and artifacts
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_HEAD_SHA: ${{ steps.release.outputs.release_head_sha }}
          SOURCE_TREE_SHA: ${{ steps.release.outputs.source_tree_sha }}
          RELEASE_BRANCH: ${{ steps.validation.outputs.release_branch }}
          PR_NUMBER: ${{ steps.validation.outputs.pr_number }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest_path = Path("release-assets/release-manifest.json")

          if not manifest_path.is_file():
              raise SystemExit("Release manifest is missing.")

          manifest = json.loads(
              manifest_path.read_text(encoding="utf-8")
          )

          checks = {
              "version": os.environ["VERSION"].removeprefix("v"),
              "release_head_sha": os.environ["RELEASE_HEAD_SHA"],
              "source_tree_sha": os.environ["SOURCE_TREE_SHA"],
              "release_branch": os.environ["RELEASE_BRANCH"],
              "pull_request": int(os.environ["PR_NUMBER"]),
          }

          for key, expected in checks.items():
              actual = manifest.get(key)

              if actual != expected:
                  raise SystemExit(
                      f"Manifest mismatch for {key}: "
                      f"expected {expected}, got {actual}"
                  )

          print("Release manifest verified.")
          PY

          test -s release-assets/msk-windows.exe
          test -s release-assets/msk-linux
          test -s release-assets/msk-macos

          echo "All platform artifacts verified."

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          set -euo pipefail

          cd release-assets

          sha256sum msk-windows.exe > msk-windows.exe.sha256
          sha256sum msk-linux > msk-linux.sha256
          sha256sum msk-macos > msk-macos.sha256

          sha256sum -c msk-windows.exe.sha256
          sha256sum -c msk-linux.sha256
          sha256sum -c msk-macos.sha256

      - name: Check release tag does not already exist
        env:
          GH_TOKEN: ${{ secrets.MSK_RELEASES_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          gh api --include \
            "repos/Omkar-git-hub/msk-releases/releases/tags/${VERSION}" \
            > api-response.txt 2>&1 || true

          HTTP_STATUS=$(sed -n '1s#^HTTP/[0-9.]* \([0-9][0-9][0-9]\).*#\1#p' api-response.txt)

          rm -f api-response.txt

          if [[ "$HTTP_STATUS" == "404" ]]; then
            echo "Release does not exist. Safe to continue."
          elif [[ "$HTTP_STATUS" == "200" ]]; then
            echo "Release ${VERSION} already exists."
            exit 1
          else
            echo "Unable to verify release existence."
            echo "HTTP status: ${HTTP_STATUS:-unknown}"
            exit 1
          fi

      - name: Checkout release repository
        uses: actions/checkout@v4
        with:
          repository: Omkar-git-hub/msk-releases
          token: ${{ secrets.MSK_RELEASES_TOKEN }}
          path: release-repo

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: Omkar-git-hub/msk-releases
          token: ${{ secrets.MSK_RELEASES_TOKEN }}
          tag_name: ${{ steps.release.outputs.version }}
          name: MSK ${{ steps.release.outputs.version }}
          target_commitish: main
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
          body: |
            ## MSK ${{ steps.release.outputs.version }}

            Official standalone builds of MSK.

            Source repository:
            https://github.com/Omkar-git-hub/msk-project-intelligence

            Source production commit:
            ${{ github.sha }}

            ### Platform packages

            - Windows: msk-windows.exe
            - Linux: msk-linux
            - macOS: msk-macos

            SHA256 checksum files are included for integrity verification.

      - name: Update release README
        working-directory: release-repo
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["VERSION"]
          readme = Path("README.md")

          start = "<!-- LATEST_RELEASE_START -->"
          end = "<!-- LATEST_RELEASE_END -->"

          section = f"""<!-- LATEST_RELEASE_START -->
          ## Latest Release: {version}

          Download MSK for your operating system:

          | Platform | Package | Download |
          |---|---|---|
          | Windows | EXE | [msk-windows.exe](https://github.com/Omkar-git-hub/msk-releases/releases/download/{version}/msk-windows.exe) |
          | Linux | Binary | [msk-linux](https://github.com/Omkar-git-hub/msk-releases/releases/download/{version}/msk-linux) |
          | macOS | Binary | [msk-macos](https://github.com/Omkar-git-hub/msk-releases/releases/download/{version}/msk-macos) |

          SHA256 checksums are available in the release assets.

          [View release notes and all downloads](https://github.com/Omkar-git-hub/msk-releases/releases/tag/{version})
          <!-- LATEST_RELEASE_END -->"""

          content = (
              readme.read_text(encoding="utf-8")
              if readme.exists()
              else ""
          )

          if start in content and end in content:
              before = content.split(start, 1)[0]
              after = content.split(end, 1)[1]
              content = before + section + after
          else:
              content = section + "\n\n" + content

          readme.write_text(content, encoding="utf-8")
          PY

      - name: Commit README update
        working-directory: release-repo
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if ! git diff --cached --quiet; then
            git commit -m "docs: update latest MSK release"
            git push origin main
          else
            echo "README is already up to date."
          fi
