name: MSK Release Validation

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: msk-release-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.platform }}
    if: >-
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.draft == false

    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            runner: windows-latest
            asset: msk-windows.exe

          - platform: linux
            runner: ubuntu-latest
            asset: msk-linux

          - platform: macos
            runner: macos-latest
            asset: msk-macos

    steps:
      - name: Checkout release PR merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Validate release version
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")

          EXPECTED_BRANCH="release/${VERSION}"

          echo "Version: ${VERSION}"
          echo "Release branch: ${GITHUB_HEAD_REF}"

          if [ "${GITHUB_HEAD_REF}" != "${EXPECTED_BRANCH}" ]; then
            echo "Release branch and project version do not match."
            exit 1
          fi

      - name: Install MSK and build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install nuitka

      - name: Build Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1

          New-Item -ItemType Directory -Force -Path dist | Out-Null

          Copy-Item msk.exe "dist/${{ matrix.asset }}"

      - name: Build Linux executable
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename="${{ matrix.asset }}" \
            --include-package=msk \
            src/msk/cli/main.py

      - name: Build macOS executable
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          python -m nuitka \
            --onefile \
            --assume-yes-for-downloads \
            --output-dir=dist \
            --output-filename="${{ matrix.asset }}" \
            --include-package=msk \
            src/msk/cli/main.py

      - name: Verify Windows executable
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          if (!(Test-Path "dist/${{ matrix.asset }}")) {
            throw "Windows executable not found."
          }

          .\dist\${{ matrix.asset }} --help

      - name: Verify Linux and macOS executables
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          set -e

          test -f "dist/${{ matrix.asset }}"
          chmod +x "dist/${{ matrix.asset }}"

          ls -lh "dist/${{ matrix.asset }}"

          "./dist/${{ matrix.asset }}" --help

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: msk-${{ matrix.platform }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 60

  manifest:
    name: Create Release Manifest
    needs: build
    runs-on: ubuntu-latest

    if: >-
      startsWith(github.head_ref, 'release/') &&
      github.event.pull_request.draft == false

    steps:
      - name: Checkout release PR merge candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Create release manifest
        env:
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RELEASE_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          import tomllib
          from pathlib import Path

          with open("pyproject.toml", "rb") as file:
              project = tomllib.load(file)

          version = project["project"]["version"]

          tree_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD^{tree}"],
              text=True
          ).strip()

          manifest = {
              "version": version,
              "release_branch": os.environ["RELEASE_BRANCH"],
              "release_head_sha": os.environ["RELEASE_HEAD_SHA"],
              "validation_commit": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"],
                  text=True
              ).strip(),
              "source_tree_sha": tree_sha,
              "pull_request": int(os.environ["PR_NUMBER"])
          }

          Path("release-manifest.json").write_text(
              json.dumps(manifest, indent=2),
              encoding="utf-8"
          )

          print(json.dumps(manifest, indent=2))
          PY

      - name: Upload release manifest
        uses: actions/upload-artifact@v4
        with:
          name: msk-release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 60
