name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test & Package
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install ruff

      - name: Lint with Ruff
        run: |
          ruff check src/ tests/

      - name: Run tests
        run: |
          pytest -v --tb=short

      - name: Build package
        run: |
          pip install build
          python -m build
          ls -la dist/

      - name: Verify wheel contents
        run: |
          pip install dist/*.whl --force-reinstall --no-deps
          msk --help

  build-windows:
    name: Windows Executable
    runs-on: windows-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install nuitka

      - name: Build MSK
        shell: pwsh
        run: |
          .\scripts\build_windows.ps1

      - name: Verify executable
        shell: pwsh
        run: |
          .\msk.exe --help
          .\msk.exe doctor

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: msk-windows
          path: msk.exe