[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "msk"
version = "0.1.0"
description = "Local-first Project Intelligence, Privacy, and Security layer for software engineering"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "MSK Engineering Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "pathspec>=0.12.0",
    "tree-sitter>=0.22.0",
    "tree-sitter-language-pack>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
msk = "msk.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/msk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "tests/fixtures", ".venv", ".git", ".msk"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
